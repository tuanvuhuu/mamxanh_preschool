<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="Mầm Xanh Preschool">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Orange C-ring (left side) -->
  <circle cx="130" cy="130" r="110" fill="none" stroke="#F58220" stroke-width="20" stroke-dasharray="170 340"/>

  <!-- Green C-ring (right side) -->
  <circle cx="130" cy="130" r="110" fill="none" stroke="#4CAF50" stroke-width="20" stroke-dasharray="170 340" stroke-dashoffset="-170"/>

  <!-- Curved text path -->
  <defs>
    <path id="circlePath" d="M 30,130 A 100,100 0 0,1 230,130"/>
  </defs>

  <!-- Text: MẦM XANH (green, left) and PRESCHOOL (orange, right) -->
  <text font-family="Arial, 'Baloo 2', sans-serif" font-size="28" font-weight="bold" letter-spacing="2" fill="#2E7D32">
    <textPath href="#circlePath" startOffset="20%" text-anchor="middle">MẦM XANH</textPath>
  </text>
  <text font-family="Arial, 'Baloo 2', sans-serif" font-size="28" font-weight="bold" letter-spacing="2" fill="#F58220">
    <textPath href="#circlePath" startOffset="80%" text-anchor="middle">PRESCHOOL</textPath>
  </text>

  <!-- GREEN HAND (top/inside - cradling) -->
  <path d="M 70 170 Q 60 185 80 200 Q 100 210 130 210 Q 140 205 135 195 Q 115 185 90 175 Z"
        fill="#2E7D32" filter="url(#shadow)"/>

  <!-- ORANGE HAND (bottom/outside - cradling) -->
  <path d="M 190 170 Q 200 185 180 200 Q 160 210 130 210 Q 120 205 125 195 Q 145 185 170 175 Z"
        fill="#F58220" filter="url(#shadow)"/>

  <!-- SPROUT CENTER -->
  <!-- Main stem -->
  <path d="M 130 200 L 130 150" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- TOP leaf (pointing up) -->
  <ellipse cx="130" cy="100" rx="14" ry="36" fill="#4CAF50" filter="url(#shadow)"/>
  <path d="M 130 70 Q 134 85 130 100 Q 126 85 130 70" stroke="#2E7D32" stroke-width="1" fill="none"/>

  <!-- LEFT-UP leaf (45 degrees) -->
  <ellipse cx="85" cy="125" rx="14" ry="36" fill="#66BB6A" transform="rotate(-45 85 125)" filter="url(#shadow)"/>

  <!-- RIGHT-UP leaf (45 degrees) -->
  <ellipse cx="175" cy="125" rx="14" ry="36" fill="#66BB6A" transform="rotate(45 175 125)" filter="url(#shadow)"/>

  <!-- LEFT-DOWN leaf -->
  <ellipse cx="100" cy="165" rx="13" ry="30" fill="#8BC34A" transform="rotate(-20 100 165)"/>

  <!-- RIGHT-DOWN leaf -->
  <ellipse cx="160" cy="165" rx="13" ry="30" fill="#8BC34A" transform="rotate(20 160 165)"/>

  <!-- GOLDEN YELLOW accent (teardrop/leaf at base) -->
  <ellipse cx="130" cy="180" rx="12" ry="14" fill="#FFC107" filter="url(#shadow)"/>
  <ellipse cx="130" cy="177" rx="7" ry="7" fill="white" opacity="0.6"/>

  <!-- SPARKLE (yellow star) at top-right -->
  <g transform="translate(170, 100)" filter="url(#shadow)">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#FFD54F"/>
    <circle cx="0" cy="0" r="1.5" fill="white" opacity="0.8"/>
  </g>
</svg>
